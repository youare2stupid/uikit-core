name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/sync-inventory.js
      - run: npm run build
      - run: npm test
      - run: npm run lint:scss
      - name: Fail when committed artifacts are stale
        run: git diff --exit-code -- dist components.json demo/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            components.json
            demo/index.html
